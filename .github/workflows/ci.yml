name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 설치
        run: pip install -e ".[dev]"

      - name: 린트
        run: ruff check .

      # 계약 스키마·공통 샘플이 계약 모델과 어긋나면 실패한다 (테스트에서도 한 번 더 확인한다).
      - name: 계약 스키마와 샘플이 최신인지 확인
        run: python -m fit_ruler.contracts.generate --check

      - name: 테스트
        run: pytest
